name: CI

on: [ push, pull_request ]

jobs:
  ci:
    name: "CI · PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.1", "8.2", "8.3", "8.4" ]
        laravel: [ "10.*", "11.*", "12.*" ]
        include:
          - laravel: "10.*"
            testbench: "8.*"
          - laravel: "11.*"
            testbench: "9.*"
          - laravel: "12.*"
            testbench: "10.*"
        exclude:
          # Laravel 11 and 12 need PHP 8.2, Laravel 10 does not support PHP 8.4.
          - php: "8.1"
            laravel: "11.*"
          - php: "8.1"
            laravel: "12.*"
          - php: "8.4"
            laravel: "10.*"

    steps:
      # --------- Setup steps ---------
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          coverage: "pcov"
          php-version: "${{ matrix.php }}"
          ini-values: memory_limit=-1
          extensions: pcov, sodium, fileinfo

      - name: "Select the Laravel version under test"
        run: |
          composer require --dev --no-interaction --no-update \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: "Install dependencies"
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: "highest"
          composer-options: "--prefer-dist"

      # --------- Run steps ---------
      - name: "Unit Tests"
        run: "vendor/bin/phpunit"

#      - name: "Static code analysis"
#        run: "vendor/bin/psalm"
